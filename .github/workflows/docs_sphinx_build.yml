name: documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel a run that is still going when a newer one starts for the same ref.
concurrency:
    group: docs-sphinx-build-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
            python-version: "3.14"

      - name: Install nox
        run: python -m pip install "nox>=2026.8.17"

      - name: Sphinx build
        run: |
          nox -s docs

      - name: Upload the built documentation for review
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html
          retention-days: 5
          if-no-files-found: error